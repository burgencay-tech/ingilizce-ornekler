<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okul Hayatı — Etkileşimli Ders</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--g:#58cc02;--gd:#46a302;--r:#ff4b4b;--rd:#d33131;--b:#1cb0f6;--bd:#1899d6;--y:#ffc800;--ink:#3c3c3c;--mut:#777;--line:#e5e5e5;--bg:#fff;--soft:#f7f7f7;--navy:#1f3a5f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
button{font-family:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.x{border:0;background:none;font-size:26px;color:#afafaf;cursor:pointer;padding:4px 6px;text-decoration:none;line-height:1}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);border-radius:10px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.hearts{font-weight:900;color:var(--r);display:flex;align-items:center;gap:4px;font-size:18px}
.xp{font-weight:900;color:#ff9600;font-size:16px;min-width:52px;text-align:right}
.tur{font-size:13px;font-weight:800;color:#a560e8;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 2px}
h2{font-size:23px;font-weight:900;margin:2px 0 14px;line-height:1.25}
.body{flex:1;padding-bottom:150px}
.opts{display:grid;gap:10px}
.opts.img{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;padding:14px;font-size:18px;font-weight:800;color:var(--ink);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
.opt .k{border:2px solid var(--line);border-radius:8px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--mut)}
.opts.img .opt{flex-direction:column;text-align:center;padding:18px 8px}
.opts.img .opt .em{font-size:52px;line-height:1}
.opt.sel{border-color:#84d8ff;background:#ddf4ff;color:var(--bd)}
.opt.ok{border-color:var(--g);background:#d7ffb8;color:var(--gd)}
.opt.no{border-color:var(--r);background:#ffdfe0;color:var(--rd)}
.opt.done{opacity:.35;pointer-events:none}
.card{border:2px solid var(--line);border-radius:18px;padding:22px;text-align:center}
.card .em{font-size:84px}
.card .en{font-size:34px;font-weight:900;color:var(--navy);margin-top:6px}
.card .tr{font-size:19px;color:var(--mut);margin-top:4px}
.card .ex{font-size:17px;margin-top:14px;background:var(--soft);border-radius:12px;padding:10px}
.spk{border:0;background:var(--b);color:#fff;border-radius:14px;box-shadow:0 4px 0 var(--bd);width:64px;height:64px;font-size:28px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.spk.sm{width:44px;height:44px;font-size:20px;border-radius:12px}
.spk.slow{background:#fff;color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prompt{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.robi{width:72px;flex:0 0 72px}
.bub{border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:700;position:relative;line-height:1.5}
.w{border-bottom:2px dotted #afafaf;cursor:pointer;position:relative}
.tip{position:absolute;left:50%;transform:translateX(-50%);bottom:130%;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:15px;white-space:nowrap;box-shadow:0 2px 0 var(--line);z-index:5;color:var(--ink)}
.slot{min-height:120px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:22px;background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:#fff;padding:9px 13px;font-size:18px;font-weight:800;cursor:pointer;color:var(--ink)}
.chip.ghost{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt{justify-content:center;text-align:center;min-height:58px}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--ink);text-align:center;color:var(--bd)}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:14px;background:var(--soft);font:700 19px Nunito,sans-serif;padding:12px;resize:none;color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:18px;font-weight:700}
.msg.l{background:var(--soft);border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.r{background:#ddf4ff;border:2px solid #84d8ff;align-self:flex-end;border-bottom-right-radius:4px;color:var(--bd)}
.msg.q{border-style:dashed;color:#afafaf;background:#fff}
.story p{font-size:18px;line-height:1.6;margin:0 0 10px;display:flex;gap:8px;align-items:flex-start}
.story p b{color:var(--navy);min-width:52px}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--b);box-shadow:0 6px 0 var(--bd);color:#fff;font-size:48px;cursor:pointer;display:block;margin:18px auto 8px}
.mic.on{background:var(--r);box-shadow:0 6px 0 var(--rd);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.note{color:var(--mut);font-size:14px;text-align:center}
.foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.foot .in{max-width:560px;margin:0 auto}
.fb{display:none;margin-bottom:12px}
.fb h3{margin:0 0 4px;font-size:21px;font-weight:900;display:flex;gap:8px;align-items:center}
.fb p{margin:0;font-size:16px;font-weight:700}
.foot.ok{background:#d7ffb8;border-color:#d7ffb8}.foot.ok .fb{display:block;color:var(--gd)}
.foot.no{background:#ffdfe0;border-color:#ffdfe0}.foot.no .fb{display:block;color:var(--rd)}
.go{width:100%;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);cursor:pointer}
.go:disabled{background:var(--line);color:#afafaf;box-shadow:0 4px 0 #ccc;cursor:default}
.foot.no .go{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.combo{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;background:#ff9600;color:#fff;font-weight:900;border-radius:20px;padding:6px 16px;transition:.3s;pointer-events:none;z-index:9}
.combo.show{opacity:1;transform:translateX(-50%) scale(1)}
.end{text-align:center;padding-top:20px}
.end h1{font-size:30px;color:#ff9600;margin:10px 0}
.stats{display:flex;gap:10px;justify-content:center;margin:18px 0}
.st{border:2px solid;border-radius:14px;overflow:hidden;min-width:96px}
.st b{display:block;color:#fff;font-size:13px;padding:4px}
.st span{display:block;font-size:24px;font-weight:900;padding:8px}
.rev{text-align:left;background:var(--soft);border-radius:14px;padding:12px 16px;margin:14px 0;font-size:16px}
.rev li{margin:4px 0}
#conf{position:fixed;inset:0;pointer-events:none;z-index:20}
.intro{text-align:center;padding-top:18px}
.intro h1{font-size:28px;margin:8px 0;color:var(--navy)}
.intro ul{text-align:left;font-size:16px;line-height:1.7;background:var(--soft);border-radius:14px;padding:12px 16px 12px 34px;margin:14px 0}
</style>
</head>
<body>
<canvas id="conf"></canvas>
<div class="app">
  <div class="top">
    <a class="x" href="index.html" title="Vitrine dön">✕</a>
    <div class="bar"><i id="bar"></i></div>
    <div class="hearts">❤ <span id="hearts">5</span></div>
    <div class="xp" id="xp">0 XP</div>
  </div>
  <div class="body" id="body"></div>
</div>
<div class="combo" id="combo"></div>
<div class="foot" id="foot"><div class="in">
  <div class="fb" id="fb"><h3 id="fbh"></h3><p id="fbp"></p></div>
  <button class="go" id="go" disabled>Kontrol et</button>
</div></div>

<script>
const ROBI=`<svg class="robi" viewBox="0 0 80 90"><rect x="38" y="2" width="4" height="10" rx="2" fill="#9fb3c8"/><circle cx="40" cy="4" r="4" fill="#1cb0f6"/><rect x="10" y="12" width="60" height="44" rx="20" fill="#eaf4ff" stroke="#9fb3c8" stroke-width="3"/><rect x="18" y="22" width="44" height="26" rx="12" fill="#1f3a5f"/><circle cx="31" cy="35" r="5" fill="#7fe0ff"/><circle cx="49" cy="35" r="5" fill="#7fe0ff"/><path d="M33 43q7 5 14 0" stroke="#7fe0ff" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="18" y="58" width="44" height="28" rx="12" fill="#eaf4ff" stroke="#9fb3c8" stroke-width="3"/><circle cx="40" cy="72" r="5" fill="#ffc800"/></svg>`;

/* ---------- ses ---------- */
let VOICE=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t,slow){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(VOICE)u.voice=VOICE;u.rate=slow?.6:.9;speechSynthesis.speak(u)}catch(e){}}
let AC=null;
function tone(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime;(ok?[660,880]:[220,170]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'square';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+i*.11);g.gain.exponentialRampToValueAtTime(ok?.25:.08,n+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,n+i*.11+.18);o.connect(g).connect(AC.destination);o.start(n+i*.11);o.stop(n+i*.11+.2)})}catch(e){}}

/* ---------- alıştırmalar (Duolingo türleri sırasıyla) ---------- */
const EX=[
 {t:'kelime',tur:'Yeni kelime',h:'Yeni kelime',em:'📚',en:'library',tr:'kütüphane',ex:'Books are borrowed from the library.'},
 {t:'resim',tur:'Resmi seç',h:'"canteen" hangisi?',ans:'canteen',ops:[['🍽️','canteen'],['🏀','gym'],['🔬','laboratory'],['📚','library']]},
 {t:'dinle-sec',tur:'Dinle ve seç',h:'Duyduğun kelimeye dokun',say:'timetable',ans:'timetable',ops:['timetable','teacher','table','tablet']},
 {t:'eslestir',tur:'Eşleştir',h:'Eşleri bul',pairs:[['classroom','sınıf'],['caretaker','hademe'],['playground','oyun alanı'],['headmaster','okul müdürü'],['counsellor','rehber öğretmen']]},
 {t:'cumle',tur:'Cümle kur',h:'Bu cümleyi İngilizceye çevir',src:'Öğrenciler kütüphanede kitap okur.',srcTip:{'Öğrenciler':'students','kütüphanede':'in the library','kitap':'books','okur':'read'},ans:'Students read books in the library',bank:['Students','read','books','in','the','library','reads','a']},
 {t:'cumle',tur:'Türkçeye çevir',h:'Bu cümleyi Türkçeye çevir',src:'The gym is cleaned every day.',srcTip:{'gym':'spor salonu','cleaned':'temizlenir','every':'her','day.':'gün'},ans:'Spor salonu her gün temizlenir',bank:['Spor','salonu','her','gün','temizlenir','temizler','sınıf'],speak:true},
 {t:'bosluk',tur:'Boşluğu doldur',h:'Doğru seçeneği seç',pre:'The classroom walls',post:'painted right now.',ans:'are being',ops:['are being','is being','are']},
 {t:'dinle-yaz',tur:'Dinle ve yaz',h:'Duyduğunu yaz',say:'I go to school by bus.',ans:'i go to school by bus'},
 {t:'konus',tur:'Sesli söyle',h:'Bu cümleyi yüksek sesle söyle',sent:'Experiments are done in the laboratory.'},
 {t:'sohbet',tur:'Sohbeti tamamla',h:'En uygun cevabı seç',chat:[['l','Hi! Are you new here?'],['r','Yes, I am. Where is the library?'],['l','?']],ans:"It's on the second floor, next to the art room.",ops:["It's on the second floor, next to the art room.","I like football.","Yes, it is Monday."]},
 {t:'hikaye',tur:'Kısa hikâye',h:'Hikâyeyi dinle ve soruyu cevapla',lines:[['Defne','Good morning, Mr Yılmaz!'],['Mr Yılmaz','Good morning, Defne. Welcome to Greenhill!'],['Defne','Thank you. When is lunch served?'],['Mr Yılmaz','Lunch is served at twelve in the canteen.']],q:'Öğle yemeği nerede veriliyor?',ans:'in the canteen',ops:['in the canteen','in the gym','in the library']},
];
let i=0,hearts=5,xp=0,streak=0,correct=0,missed=[],sel=null,check=null,state='ask';
const $=s=>document.getElementById(s);
const body=$('body'),go=$('go'),foot=$('foot');

function intro(){
 body.innerHTML=`<div class="intro">${ROBI.replace('class="robi"','style="width:110px"')}<h1>Okul Hayatı</h1><p style="font-size:18px;margin:0">5. sınıf · Ünite 9 · Ders 1</p>
 <ul><li>11 alıştırma, her biri farklı bir tür</li><li>Kelimeye dokununca anlamı görünür</li><li>🔊 düğmesiyle ses dinlenir (telefonun sesi açık olmalı)</li><li>5 can, XP, seri ve sonda tekrar listesi</li></ul></div>`;
 go.disabled=false;go.textContent='Başla';state='intro';
}
function setBar(){$('bar').style.width=(i/EX.length*100)+'%';$('hearts').textContent=hearts;$('xp').textContent=xp+' XP'}
function ready(v){go.disabled=!v}
function head(e){return `<div class="tur">${e.tur}</div><h2>${e.h}</h2>`}
function tipWords(text,map){return text.split(' ').map(w=>map[w]?`<span class="w" data-t="${map[w]}">${w}</span>`:w).join(' ')}
function bindTips(){body.querySelectorAll('.w').forEach(w=>w.onclick=ev=>{ev.stopPropagation();body.querySelectorAll('.tip').forEach(t=>t.remove());const t=document.createElement('span');t.className='tip';t.textContent=w.dataset.t;w.appendChild(t);setTimeout(()=>t.remove(),1800)})}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
const norm=s=>s.toLowerCase().replace(/[.,!?’']/g,'').replace(/\s+/g,' ').trim();

function render(){
 setBar();state='ask';sel=null;foot.className='foot';go.textContent='Kontrol et';ready(false);
 const e=EX[i];let h=head(e);
 if(e.t==='kelime'){
  h+=`<div class="card"><div class="em">${e.em}</div><div class="en">${e.en}</div><div class="tr">${e.tr}</div><div class="row" style="justify-content:center;margin:14px 0 0"><button class="spk" id="s1">🔊</button></div><div class="ex">${e.ex}</div></div>`;
  body.innerHTML=h;$('s1').onclick=()=>say(e.en+'. '+e.ex);check=()=>true;ready(true);go.textContent='Devam';
 }
 else if(e.t==='resim'){
  h+=`<div class="opts img">`+shuffle(e.ops).map(([em,w])=>`<button class="opt" data-v="${w}"><span class="em">${em}</span>${w}</button>`).join('')+`</div>`;
  body.innerHTML=h;pick();check=()=>sel===e.ans;
 }
 else if(e.t==='dinle-sec'){
  h+=`<div class="row"><button class="spk" id="s1">🔊</button><button class="spk slow" id="s2">🐢</button></div><div class="opts">`+shuffle(e.ops).map((w,k)=>`<button class="opt" data-v="${w}"><span class="k">${k+1}</span>${w}</button>`).join('')+`</div>`;
  body.innerHTML=h;$('s1').onclick=()=>say(e.say);$('s2').onclick=()=>say(e.say,1);setTimeout(()=>say(e.say),400);pick();check=()=>sel===e.ans;
 }
 else if(e.t==='eslestir'){
  const L=shuffle(e.pairs.map(p=>p[0])),R=shuffle(e.pairs.map(p=>p[1]));let a=null,done=0,err=false;
  h+=`<div class="pairs">`+L.map((w,k)=>`<button class="opt" data-s="L" data-v="${w}">${w}</button><button class="opt" data-s="R" data-v="${R[k]}">${R[k]}</button>`).join('')+`</div>`;
  body.innerHTML=h;
  body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   if(b.dataset.s==='L')say(b.dataset.v);
   if(!a){a=b;b.classList.add('sel');return}
   if(a===b){b.classList.remove('sel');a=null;return}
   if(a.dataset.s===b.dataset.s){a.classList.remove('sel');a=b;b.classList.add('sel');return}
   const en=a.dataset.s==='L'?a.dataset.v:b.dataset.v,tr=a.dataset.s==='L'?b.dataset.v:a.dataset.v;
   const ok=e.pairs.some(p=>p[0]===en&&p[1]===tr);const x=a;a=null;
   [x,b].forEach(z=>{z.classList.remove('sel');z.classList.add(ok?'ok':'no')});tone(ok);
   if(ok){setTimeout(()=>[x,b].forEach(z=>z.classList.add('done')),300);if(++done===e.pairs.length){check=()=>!err;ready(true)}}
   else{err=true;if(!missed.includes(en))missed.push(en);setTimeout(()=>[x,b].forEach(z=>z.classList.remove('no')),500)}
  });
  check=()=>!err;
 }
 else if(e.t==='cumle'){
  const bank=shuffle(e.bank).map((w,k)=>({w,k}));let line=[];
  h+=`<div class="prompt">${ROBI}<div class="bub">${e.speak?'<button class="spk sm" id="s1" style="float:left;margin-right:8px">🔊</button>':''}${tipWords(e.src,e.srcTip)}</div></div><div class="slot" id="slot"></div><div class="bank" id="bank"></div>`;
  body.innerHTML=h;bindTips();if(e.speak){$('s1').onclick=()=>say(e.src);setTimeout(()=>say(e.src),400)}
  const draw=()=>{$('slot').innerHTML=line.map(o=>`<button class="chip" data-k="${o.k}">${o.w}</button>`).join('');$('bank').innerHTML=bank.map(o=>`<button class="chip ${line.includes(o)?'ghost':''}" data-k="${o.k}">${o.w}</button>`).join('');
   $('slot').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{line=line.filter(o=>o.k!=c.dataset.k);draw()});
   $('bank').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const o=bank.find(o=>o.k==c.dataset.k);line.push(o);if(!e.speak)say(o.w);draw()});ready(line.length>0)};
  draw();check=()=>norm(line.map(o=>o.w).join(' '))===norm(e.ans);
 }
 else if(e.t==='bosluk'){
  h+=`<div class="bub" style="margin-bottom:16px">${e.pre} <span class="blank" id="bl">&nbsp;</span> ${e.post}</div><div class="opts">`+shuffle(e.ops).map((w,k)=>`<button class="opt" data-v="${w}"><span class="k">${k+1}</span>${w}</button>`).join('')+`</div>`;
  body.innerHTML=h;pick(v=>$('bl').textContent=v);check=()=>sel===e.ans;
 }
 else if(e.t==='dinle-yaz'){
  h+=`<div class="row"><button class="spk" id="s1">🔊</button><button class="spk slow" id="s2">🐢</button></div><textarea id="ta" placeholder="İngilizce yaz…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>`;
  body.innerHTML=h;$('s1').onclick=()=>say(e.say);$('s2').onclick=()=>say(e.say,1);setTimeout(()=>say(e.say),400);
  $('ta').oninput=()=>ready($('ta').value.trim().length>0);check=()=>norm($('ta').value)===e.ans;
 }
 else if(e.t==='konus'){
  h+=`<div class="prompt">${ROBI}<div class="bub"><button class="spk sm" id="s1" style="float:left;margin-right:8px">🔊</button>${e.sent}</div></div><button class="mic" id="mic">🎤</button><p class="note" id="mn">Mikrofona dokun ve cümleyi söyle</p>`;
  body.innerHTML=h;$('s1').onclick=()=>say(e.sent);
  check=()=>true;
  $('mic').onclick=()=>{
   const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
   const self=()=>{$('mn').innerHTML='Bu ekranda mikrofon kapalı. Cümleyi yüksek sesle söyleyip <b>Söyledim</b>’e bas.<br>Kurulumda telefonun mikrofonu telaffuzu kendisi puanlar.';go.textContent='Söyledim';ready(true)};
   if(!SR){self();return}
   try{const r=new SR();r.lang='en-GB';r.interimResults=false;$('mic').classList.add('on');$('mn').textContent='Dinliyorum…';
    let got=false;const tm=setTimeout(()=>{if(!got){try{r.abort()}catch(_){}$('mic').classList.remove('on');self()}},7000);r.onresult=ev=>{got=true;clearTimeout(tm);const t=ev.results[0][0].transcript;const a=norm(e.sent).split(' '),b=norm(t).split(' ');const hit=a.filter(w=>b.includes(w)).length;const p=Math.round(hit/a.length*100);$('mn').innerHTML=`Duyduğum: “${t}” · Uyum: <b>%${p}</b>`;check=()=>p>=60;ready(true)};
    r.onerror=()=>{clearTimeout(tm);if(!got){$('mic').classList.remove('on');self()}};r.onend=()=>$('mic').classList.remove('on');r.start()}catch(err){self()}
  };
 }
 else if(e.t==='sohbet'){
  h+=`<div class="chat">`+e.chat.map(([s,m])=>`<div class="msg ${s} ${m==='?'?'q':''}" ${m==='?'?'id="qq"':''}>${m==='?'?'…':m}</div>`).join('')+`</div><div class="opts">`+shuffle(e.ops).map((w,k)=>`<button class="opt" data-v="${w}"><span class="k">${k+1}</span>${w}</button>`).join('')+`</div>`;
  body.innerHTML=h;setTimeout(()=>say(e.chat[0][1]+' '+e.chat[1][1]),400);pick(v=>{$('qq').textContent=v;$('qq').classList.remove('q')});check=()=>sel===e.ans;
 }
 else if(e.t==='hikaye'){
  h+=`<div class="story">`+e.lines.map(([n,l],k)=>`<p><button class="spk sm" data-k="${k}">🔊</button><span><b>${n}:</b> ${l}</span></p>`).join('')+`</div><h2 style="font-size:19px;margin-top:16px">${e.q}</h2><div class="opts">`+shuffle(e.ops).map((w,k)=>`<button class="opt" data-v="${w}"><span class="k">${k+1}</span>${w}</button>`).join('')+`</div>`;
  body.innerHTML=h;body.querySelectorAll('.story .spk').forEach(b=>b.onclick=()=>say(e.lines[b.dataset.k][1]));pick();check=()=>sel===e.ans;
 }
}
function pick(cb){body.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{body.querySelectorAll('.opts .opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.v;if(/^[A-Za-z]/.test(sel)&&sel.length<40)say(sel);cb&&cb(sel);ready(true)})}

function answerText(e){return e.ans||e.sent||''}
go.onclick=()=>{
 if(state==='intro'){render();return}
 if(state==='ask'){
  const e=EX[i];const ok=check();state='shown';
  if(e.t==='kelime'){next();return}
  foot.className='foot '+(ok?'ok':'no');tone(ok);
  if(ok){correct++;streak++;xp+=10+(streak>=3?5:0);$('fbh').innerHTML='✔ Harika!';$('fbp').textContent=e.t==='eslestir'?'Bütün eşleri buldun.':'';
   if(streak>=3){const c=$('combo');c.textContent='🔥 '+streak+' doğru üst üste! +5 XP';c.classList.add('show');setTimeout(()=>c.classList.remove('show'),1400)}}
  else{streak=0;hearts=Math.max(0,hearts-1);const k=e.en||e.ans||e.sent;if(k&&!missed.includes(k))missed.push(k);$('fbh').innerHTML='✖ Doğru cevap:';$('fbp').textContent=e.t==='eslestir'?'Bazı eşleri ilk denemede bulamadın.':answerText(e)}
  body.querySelectorAll('.opts .opt').forEach(b=>{if(b.dataset.v===e.ans)b.classList.add('ok');else if(b.classList.contains('sel')&&!ok)b.classList.add('no');b.onclick=null});
  setBar();go.textContent='Devam';go.disabled=false;return
 }
 next();
};
function next(){i++;if(i>=EX.length||hearts===0){finish();return}render()}
function finish(){
 setBar();$('bar').style.width='100%';foot.className='foot';state='end';
 const pct=Math.round(correct/(EX.length-1)*100);
 body.innerHTML=`<div class="end">${ROBI.replace('class="robi"','style="width:120px"')}<h1>${hearts===0?'Canların bitti!':'Ders tamam!'}</h1>
 <div class="stats"><div class="st" style="border-color:#ffc800"><b style="background:#ffc800">TOPLAM XP</b><span style="color:#ff9600">${xp}</span></div><div class="st" style="border-color:#58cc02"><b style="background:#58cc02">BAŞARI</b><span style="color:#46a302">%${pct}</span></div><div class="st" style="border-color:#ff4b4b"><b style="background:#ff4b4b">CAN</b><span style="color:#d33131">${hearts}</span></div></div>
 ${missed.length?`<div class="rev"><b>Yarın tekrar edilecekler</b><ul>${missed.map(m=>`<li>${m}</li>`).join('')}</ul><span class="note">Sistem bunları aralıklı tekrar için bir sonraki derse ekler.</span></div>`:'<div class="rev"><b>Hiç hata yok.</b> Bir sonraki ders bir seviye zor açılır.</div>'}</div>`;
 go.textContent='Baştan başla';go.disabled=false;go.onclick=()=>location.reload();if(hearts>0)confetti();
}
function confetti(){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:4+Math.random()*5,c:['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#a560e8'][Math.floor(Math.random()*5)],a:Math.random()*6}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x+Math.sin(p.a)*8,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++t<200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!go.disabled&&document.activeElement.tagName!=='TEXTAREA')go.click()});
intro();
</script>
