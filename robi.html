<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robi'yle Okul Turu — Etkileşimli Animasyon</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:#eaf6ff;color:#23324a}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.top a{color:#7a8aa3;text-decoration:none;font-size:24px}
.top h1{flex:1;margin:0;font-size:20px}
.stars{font-weight:900;color:#e79a00;font-size:18px}
.stage{position:relative;width:100%;aspect-ratio:4/3.2;border-radius:18px;overflow:hidden;background:linear-gradient(#bfe6ff 0 28%,#9ad46b 28%);box-shadow:0 6px 0 #b8d3e8}
.sun{position:absolute;right:6%;top:4%;width:12%;aspect-ratio:1;border-radius:50%;background:#ffd34d;box-shadow:0 0 0 10px rgba(255,211,77,.35);animation:sun 6s ease-in-out infinite}
@keyframes sun{50%{box-shadow:0 0 0 18px rgba(255,211,77,.15)}}
.cloud{position:absolute;top:7%;width:18%;height:7%;background:#fff;border-radius:40px;opacity:.9;animation:cloud 26s linear infinite}
.cloud:before{content:"";position:absolute;width:50%;height:150%;left:18%;top:-60%;background:#fff;border-radius:50%}
@keyframes cloud{from{left:-20%}to{left:110%}}
.path{position:absolute;left:2%;right:2%;top:58%;height:8%;background:#e8d2a6;border-radius:30px}
.room{position:absolute;width:28%;height:24%;border:0;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;font-weight:900;font-size:clamp(11px,2.6vw,16px);color:#23324a;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .2s}
.room:active{transform:translateY(3px)}
.room .ic{font-size:clamp(24px,7vw,44px);line-height:1.1}
.room .roof{position:absolute;top:-14%;left:-4%;right:-4%;height:18%;border-radius:8px 8px 0 0;background:rgba(0,0,0,.18)}
.room.done:after{content:"⭐";position:absolute;top:-10px;right:-8px;font-size:22px;animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}}
#robi{position:absolute;width:13%;left:44%;top:52%;transition:left 1.4s cubic-bezier(.5,0,.3,1),top 1.4s cubic-bezier(.5,0,.3,1);z-index:5}
#robi svg{width:100%;display:block;animation:bob 1.2s ease-in-out infinite}
#robi.walk svg{animation:walk .35s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6%)}}
@keyframes walk{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8%)}}
.bubble{position:absolute;z-index:6;left:50%;transform:translateX(-50%);top:3%;width:92%;background:#fff;border-radius:16px;padding:10px 14px;font-size:clamp(14px,3.6vw,19px);box-shadow:0 4px 0 #c9dbe9;opacity:0;transition:opacity .3s}
.bubble.show{opacity:1}
.bubble b{color:#1cb0f6}
.panel{background:#fff;border-radius:18px;margin-top:12px;padding:14px;box-shadow:0 4px 0 #c9dbe9;min-height:120px}
.panel h2{margin:0 0 10px;font-size:18px}
.ops{display:grid;gap:8px}
.op{border:2px solid #dfe7ef;border-bottom-width:4px;border-radius:12px;background:#fff;padding:11px;font:800 16px Nunito,sans-serif;color:#23324a;cursor:pointer;text-align:left}
.op.ok{border-color:#58cc02;background:#d7ffb8}.op.no{border-color:#ff4b4b;background:#ffdfe0}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font:900 16px Nunito,sans-serif;color:#fff;background:#1cb0f6;box-shadow:0 4px 0 #1899d6;cursor:pointer;min-width:140px}
.btn.g{background:#58cc02;box-shadow:0 4px 0 #46a302}
.hint{color:#7a8aa3;font-size:14px;margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html" title="Vitrine dön">✕</a><h1>Robi'yle Okul Turu</h1><div class="stars">⭐ <span id="st">0</span>/6</div></div>
  <div class="stage" id="stage">
    <div class="sun"></div><div class="cloud"></div><div class="cloud" style="animation-delay:-13s;top:15%;width:14%"></div>
    <div class="path"></div>
    <div class="bubble" id="bub"></div>
    <div id="robi"><svg viewBox="0 0 80 90"><rect x="38" y="2" width="4" height="10" rx="2" fill="#9fb3c8"/><circle cx="40" cy="4" r="4" fill="#ff4b4b"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></circle><rect x="10" y="12" width="60" height="44" rx="20" fill="#f4f9ff" stroke="#9fb3c8" stroke-width="3"/><rect x="18" y="22" width="44" height="26" rx="12" fill="#1f3a5f"/><g><circle cx="31" cy="35" r="5" fill="#7fe0ff"/><circle cx="49" cy="35" r="5" fill="#7fe0ff"/><animateTransform attributeName="transform" type="scale" values="1 1;1 .1;1 1" keyTimes="0;.5;1" dur=".25s" begin="0s;3s;6s;9s" additive="sum"/></g><path d="M33 43q7 5 14 0" stroke="#7fe0ff" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="18" y="58" width="44" height="28" rx="12" fill="#f4f9ff" stroke="#9fb3c8" stroke-width="3"/><circle cx="40" cy="72" r="5" fill="#ffc800"/></svg></div>
  </div>
  <div class="panel" id="panel"></div>
</div>
<script>
const R=[
 {id:'library',ic:'📚',ad:'Library',x:4,y:31,c:'#ffd9a8',s:'This is the <b>library</b>. Books <b>are read</b> here. They <b>are borrowed</b> every week.',q:'What is done in the library?',ops:['Books are read.','Lunch is served.','Football is played.'],a:0},
 {id:'canteen',ic:'🍽️',ad:'Canteen',x:36,y:31,c:'#ffe8ef',s:'This is the <b>canteen</b>. Lunch <b>is served</b> at twelve o’clock.',q:'When is lunch served?',ops:['At nine.','At twelve.','At three.'],a:1},
 {id:'lab',ic:'🔬',ad:'Science lab',x:68,y:31,c:'#d6f5e3',s:'This is the <b>science lab</b>. Experiments <b>are done</b> here. Goggles <b>are worn</b>.',q:'What is worn in the lab?',ops:['Hats are worn.','Goggles are worn.','Shoes are cleaned.'],a:1},
 {id:'gym',ic:'🏀',ad:'Gym',x:4,y:70,c:'#dbe9ff',s:'This is the <b>gym</b>. Basketball <b>is played</b> here. The gym <b>is cleaned</b> every day.',q:'How often is the gym cleaned?',ops:['Every week.','Every day.','Never.'],a:1},
 {id:'class',ic:'✏️',ad:'Classroom',x:36,y:70,c:'#fff4c2',s:'This is our <b>classroom</b>. Right now, the walls <b>are being painted</b>!',q:'What is happening in the classroom now?',ops:['The walls are being painted.','A cake is being made.','Books are being sold.'],a:0},
 {id:'garden',ic:'🌻',ad:'Garden',x:68,y:70,c:'#e7f7c9',s:'This is the school <b>garden</b>. The plants <b>are watered</b> every Friday.',q:'When are the plants watered?',ops:['Every Monday.','Every Friday.','Every Sunday.'],a:1},
];
const st=document.getElementById('stage'),robi=document.getElementById('robi'),bub=document.getElementById('bub'),panel=document.getElementById('panel');
let done=new Set(),busy=false,auto=false;
R.forEach(r=>{const b=document.createElement('button');b.className='room';b.id='r_'+r.id;b.style.cssText=`left:${r.x}%;top:${r.y}%;background:${r.c}`;b.innerHTML=`<span class="roof"></span><span class="ic">${r.ic}</span>${r.ad}`;b.onclick=()=>{if(!busy){auto=false;visit(r)}};st.appendChild(b)});
let V=null;function pv(){try{const v=speechSynthesis.getVoices();V=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}try{pv();speechSynthesis.onvoiceschanged=pv}catch(e){}
function say(t,cb){const plain=t.replace(/<[^>]+>/g,'');let fired=false;const end=()=>{if(!fired){fired=true;cb&&cb()}};try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain);u.lang='en-GB';if(V)u.voice=V;u.rate=.88;u.onend=end;u.onerror=end;speechSynthesis.speak(u)}catch(e){}setTimeout(end,plain.length*85+1200)}
function move(r,cb){robi.classList.add('walk');robi.style.left=(r.x+7.5)+'%';robi.style.top='47%';setTimeout(()=>{robi.classList.remove('walk');cb()},1450)}
function home(){panel.innerHTML=`<h2>Okul binasına dokun, Robi seni oraya götürsün</h2><p class="hint">Her odada Robi bir cümle söyler, sonra sana bir soru sorar. Doğru cevap bir yıldız kazandırır.</p><div class="btns"><button class="btn g" id="auto">▶ Kendiliğinden izle</button></div>`;document.getElementById('auto').onclick=()=>{auto=true;tour(0)}}
function visit(r,cb){busy=true;bub.classList.remove('show');panel.innerHTML='<h2>Robi yolda…</h2>';move(r,()=>{bub.innerHTML='🤖 '+r.s;bub.classList.add('show');say(r.s,()=>{if(auto){done.add(r.id);mark(r);busy=false;cb&&cb();return}ask(r)})})}
function ask(r){panel.innerHTML=`<h2>${r.q}</h2><div class="ops">`+r.ops.map((o,k)=>`<button class="op" data-k="${k}">${o}</button>`).join('')+`</div><div class="btns"><button class="btn" id="again">🔊 Tekrar dinle</button></div>`;document.getElementById('again').onclick=()=>say(r.s);busy=false;
 panel.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===r.a;b.classList.add(ok?'ok':'no');if(ok){say(r.ops[r.a]);done.add(r.id);mark(r);setTimeout(()=>{if(done.size===6)finish();else{bub.classList.remove('show');home()}},1100)}})}
function mark(r){document.getElementById('r_'+r.id).classList.add('done');document.getElementById('st').textContent=done.size}
function tour(k){if(!auto)return;if(k>=R.length){finish();return}visit(R[k],()=>setTimeout(()=>tour(k+1),500))}
function finish(){auto=false;bub.innerHTML='🤖 Great job! You know our school now. See you tomorrow!';bub.classList.add('show');say("Great job! You know our school now. See you tomorrow!");panel.innerHTML=`<h2>🏆 Tur tamam! 6 yıldızın hepsini topladın.</h2><p class="hint">Bu küçük animasyon kitaptaki her üniteye göre üretilebilir: aynı karakter, ünitenin mekânları ve cümleleri.</p><div class="btns"><button class="btn g" onclick="location.reload()">↺ Baştan</button></div>`}
home();
</script>
<script>
/* Ses kilidi: ilk dokunuşta telefonun ses çıkışını açar (iPhone sessiz düğmesi dahil) */
(function(){var done=false;function u(){if(done)return;done=true;try{var a=new Audio('data:audio/wav;base64,UklGRmQfAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAfAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==');a.loop=true;a.volume=0.01;a.setAttribute('playsinline','');a.play().catch(function(){})}catch(e){}
try{var C=window.AudioContext||window.webkitAudioContext;if(C){var c=new C();var o=c.createOscillator(),g=c.createGain();g.gain.value=0;o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.05);c.resume&&c.resume()}}catch(e){}
try{if(window.Sound){Sound.init&&Sound.init()}}catch(e){}
try{var s=new SpeechSynthesisUtterance(' ');s.volume=0;speechSynthesis.speak(s)}catch(e){}}
['pointerdown','touchstart','click','keydown'].forEach(function(ev){document.addEventListener(ev,u,{capture:true,passive:true})});})();
</script></body>
